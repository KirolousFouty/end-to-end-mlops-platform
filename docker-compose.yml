services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: mlops, POSTGRES_PASSWORD: mlops, POSTGRES_DB: mlops}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U mlops"], interval: 5s, timeout: 5s, retries: 10}
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.2
    command: mlflow server --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]
  api:
    build: .
    environment: {DATABASE_URL: postgresql+psycopg://mlops:mlops@postgres:5432/mlops, MLFLOW_TRACKING_URI: http://mlflow:5000}
    ports: ["8000:8000"]
    depends_on: {postgres: {condition: service_healthy}}
  prometheus:
    image: prom/prometheus:v2.52.0
    volumes: ["./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:10.4.2
    ports: ["3000:3000"]
    volumes: ["./grafana/provisioning:/etc/grafana/provisioning:ro", "./grafana/dashboards:/var/lib/grafana/dashboards:ro"]
