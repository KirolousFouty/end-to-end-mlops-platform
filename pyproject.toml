[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "end-to-end-mlops-platform"
version = "0.1.0"
description = "Local-first customer churn MLOps and monitoring platform"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1", "numpy>=1.26", "scikit-learn>=1.4", "joblib>=1.3",
  "fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6",
  "sqlalchemy>=2.0", "psycopg[binary]>=3.1", "prometheus-client>=0.20",
  "mlflow>=2.12", "prefect>=2.16", "evidently>=0.4.28"
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "mypy>=1.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
